# main ブランチに push されたら GitHub Pages に公開する
# セキュリティ:
# - pull_request では動かない (フォークからの PR でコードが実行されることはない)
# - 外部アクションはタグではなくコミット SHA で固定 (タグのすり替え対策)
# - 権限は必要な job にだけ最小限で付与
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository_owner == 'Nobukins'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html style.css js assets _site/
          python3 tools/build_single.py _site/super-popo-land.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
